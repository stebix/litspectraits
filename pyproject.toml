[project]
name = 'litspectraits'
version = '0.1.0'
description = 'Pipeline for extracting MR / EM tissue properties from literature'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'attrs>=24.2',
    'cattrs>=24.1',
    'httpx[http2]>=0.27',
    'lxml>=5.3',
    'platformdirs>=4.3',
    'python-dotenv>=1.0',
    'rich>=13.9',
    'structlog>=24.4',
    'tenacity>=9.0',
    'typer>=0.13',
]

[project.optional-dependencies]
wiley = ['wiley-tdm>=1.0']
springer = ['springernature-api-client>=0.0.9']
# The default extraction install. As of the MinerU-primary promotion
# (docs/mineru-primary-promotion.md §3) this pulls BOTH the primary MinerU
# backend and the docling fallback, so `uv sync --extra extract` yields a
# working default path — a bare `litspectraits extract <doi>` runs MinerU's
# vlm-engine, and `--backend docling-standard` remains available. torch /
# torchvision arrive transitively via docling-ibm-models and MinerU, but they
# are listed explicitly so the `[tool.uv.sources]` pin to the CUDA-12.6 wheel
# index takes effect — uv only honours `sources` for direct dependencies.
# Version bounds mirror docling-ibm-models' own constraints.
extract = ['docling>=2.0', 'torch>=2.2.2,<3', 'torchvision<1', 'mineru[pipeline,vlm]>=2.0']
# Standalone MinerU — the same primary PDF backend as in `[extract]`, but
# without docling, for a MinerU-only machine (the two backends are independent
# extras). `mineru[pipeline]` is required, not bare `mineru` — the bare package
# ships only the CLI/`do_parse` shim with no model backend (no torch), so it
# imports but cannot parse. The `pipeline` engine reads the PDF text layer
# (exact geometry → `geometry_fidelity='exact'`) and is leaner than `[core]`
# (no gradio/vllm). `[vlm]` (transformers-backed inference) backs the default
# --mineru-engine vlm-engine and hybrid-engine — deliberately not
# `[vllm]`/`[lmdeploy]`, MinerU's faster-but-heavier serving engines;
# `get_vlm_engine('auto', ...)` falls back to plain `transformers` when neither
# is importable, so `[vlm]` alone is a working (if slower) default. Both
# `[pipeline]`'s and `[vlm]`'s torch bounds (`torch<3,>=2.6.0`) co-resolve with
# docling's `torch>=2.2.2,<3` under the CUDA-12.6 `[tool.uv.sources]` pin
# (verified: all three share torch 2.11+cu126). Declaring the extra does not
# install it.
mineru = ['mineru[pipeline,vlm]>=2.0']
all = [
    'litspectraits[wiley,springer,extract,mineru]',
]

[project.scripts]
litspectraits = 'litspectraits.cli:app'

[dependency-groups]
dev = [
    'lxml-stubs>=0.5.1',
    'pyright>=1.1.385',
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'respx>=0.21',
    'ruff>=0.7',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/litspectraits']

# torch/torchvision arrive transitively via docling-ibm-models. The default
# PyPI wheel is the +cu130 build (CUDA 13.0), which needs an NVIDIA driver
# >= ~580; our boxes run 550.x (CUDA 12.4 ceiling), so it silently falls back
# to CPU. Pin the CUDA-12.6 build instead — same torch version, runs on a
# 12.x driver via CUDA minor-version compatibility. Bump this index when the
# driver baseline moves. `explicit = true` keeps the index scoped to the two
# packages below.
[[tool.uv.index]]
name = 'pytorch-cu126'
url = 'https://download.pytorch.org/whl/cu126'
explicit = true

[tool.uv.sources]
torch = [{ index = 'pytorch-cu126' }]
torchvision = [{ index = 'pytorch-cu126' }]

[tool.ruff]
line-length = 99
target-version = 'py314'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'B', 'UP', 'N', 'RUF', 'SIM']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101']

[tool.ruff.lint.flake8-bugbear]
# Typer's marker factories must live in argument defaults — that's the
# library's API contract. Whitelist them so B008 doesn't flag the
# idiomatic ``param: T = typer.Option(...)`` pattern.
extend-immutable-calls = ['typer.Argument', 'typer.Option']

[tool.pyright]
pythonVersion = '3.14'
typeCheckingMode = 'standard'
include = ['src', 'tests']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
# Smoke tests hit real publisher APIs (overview-v3.md §22) — never part of the
# default green-bar run. Deselected here; opt in with `uv run pytest -m smoke`
# (a `-m` on the command line overrides this default).
addopts = ['-m', 'not smoke']
markers = [
    "extract_real: opt out of the default doctor extract-section mute (tests/test_doctor.py)",
    "smoke: gated end-to-end test against a real publisher API; run with `-m smoke` (tests/smoke/)",
    "requires_wiley_creds: smoke test needing WILEY_TDM_TOKEN (or Würzburg-egress IP auth)",
    "requires_springer_creds: smoke test needing SPRINGER_OA_API_KEY or SPRINGER_TDM_API_KEY",
    "requires_elsevier_creds: smoke test needing ELSEVIER_API_KEY",
]
