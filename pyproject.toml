[project]
name = 'litspectraits'
version = '0.1.0'
description = 'Pipeline for extracting MR / EM tissue properties from literature'
readme = 'README.md'
requires-python = '>=3.14'
dependencies = [
    'attrs>=24.2',
    'cattrs>=24.1',
    'httpx[http2]>=0.27',
    'lxml>=5.3',
    'platformdirs>=4.3',
    'python-dotenv>=1.0',
    'rich>=13.9',
    'structlog>=24.4',
    'tenacity>=9.0',
    'typer>=0.13',
]

[project.optional-dependencies]
wiley = ['wiley-tdm>=1.0']
springer = ['springernature-api-client>=0.0.9']
# torch / torchvision are pulled in transitively by docling-ibm-models, but
# they are listed here explicitly so the `[tool.uv.sources]` pin to the
# CUDA-12.6 wheel index takes effect — uv only honours `sources` for direct
# dependencies. Version bounds mirror docling-ibm-models' own constraints.
extract = ['docling>=2.0', 'torch>=2.2.2,<3', 'torchvision<1']
all = [
    'litspectraits[wiley,springer,extract]',
]

[project.scripts]
litspectraits = 'litspectraits.cli:app'

[dependency-groups]
dev = [
    'lxml-stubs>=0.5.1',
    'pyright>=1.1.385',
    'pytest>=8.3',
    'pytest-asyncio>=0.24',
    'respx>=0.21',
    'ruff>=0.7',
]

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/litspectraits']

# torch/torchvision arrive transitively via docling-ibm-models. The default
# PyPI wheel is the +cu130 build (CUDA 13.0), which needs an NVIDIA driver
# >= ~580; our boxes run 550.x (CUDA 12.4 ceiling), so it silently falls back
# to CPU. Pin the CUDA-12.6 build instead — same torch version, runs on a
# 12.x driver via CUDA minor-version compatibility. Bump this index when the
# driver baseline moves. `explicit = true` keeps the index scoped to the two
# packages below.
[[tool.uv.index]]
name = 'pytorch-cu126'
url = 'https://download.pytorch.org/whl/cu126'
explicit = true

[tool.uv.sources]
torch = [{ index = 'pytorch-cu126' }]
torchvision = [{ index = 'pytorch-cu126' }]

[tool.ruff]
line-length = 99
target-version = 'py314'

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I', 'B', 'UP', 'N', 'RUF', 'SIM']

[tool.ruff.lint.per-file-ignores]
'tests/**' = ['S101']

[tool.ruff.lint.flake8-bugbear]
# Typer's marker factories must live in argument defaults — that's the
# library's API contract. Whitelist them so B008 doesn't flag the
# idiomatic ``param: T = typer.Option(...)`` pattern.
extend-immutable-calls = ['typer.Argument', 'typer.Option']

[tool.pyright]
pythonVersion = '3.14'
typeCheckingMode = 'standard'
include = ['src', 'tests']

[tool.pytest.ini_options]
asyncio_mode = 'auto'
testpaths = ['tests']
markers = [
    "extract_real: opt out of the default doctor extract-section mute (tests/test_doctor.py)",
]
